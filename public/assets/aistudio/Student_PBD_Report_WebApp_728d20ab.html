<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Murid - PBD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .sidebar-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .student-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .student-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-item:hover {
            background-color: #f1f5f9;
        }

        .student-item.active {
            background-color: #eff6ff;
            color: var(--primary);
            font-weight: 500;
        }

        .student-name {
            font-size: 0.9rem;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .topbar {
            padding: 16px 32px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-print {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-print:hover {
            background-color: var(--primary-hover);
        }

        .report-container {
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .report-card {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        /* Report Inner Styles */
        .report-header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid var(--border-color);
        }

        .report-header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .report-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .info-value {
            font-weight: 500;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        td {
            font-size: 0.95rem;
        }
        
        .score-col {
            text-align: center;
            font-weight: 600;
        }

        .overall-section {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 24px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .overall-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e3a8a;
        }

        .overall-score {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                height: auto;
                overflow: visible;
            }
            .sidebar, .topbar {
                display: none;
            }
            .main-content {
                display: block;
                overflow: visible;
            }
            .report-container {
                padding: 0;
            }
            .report-card {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .info-grid {
                background: transparent;
                border: 1px solid var(--border-color);
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .overall-section {
                background: #eff6ff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            th {
                background-color: #f8fafc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Senarai Murid</h2>
            <p>4 POLITE • Prinsip Perakaunan</p>
        </div>
        <div class="student-list" id="studentList">
            <!-- Student items injected here -->
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <button class="btn-print" onclick="window.print()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                Print Report
            </button>
        </div>
        <div class="report-container">
            <div id="reportArea" class="report-card">
                <div class="empty-state">
                    <h3>Select a student from the sidebar to view their report.</h3>
                </div>
            </div>
        </div>
    </div>

    <script>

                teacher: "PN. NORSUZALINA",
                class: "4 POLITE"
            },
            students: [

                {id: 2, name: "CHEN YU QIAN", ic: "101005-10-0813", gender: "L", modules: [3, 3, 3, 3, 3, 4, 3, 3, 3], overall: 3},
                {id: 3, name: "CHEONG EXIN", ic: "100310-14-0884", gender: "P", modules: [3, 4, 3, 5, 5, 5, 5, 5, 5], overall: 5},
                {id: 4, name: "CHIN WEE KI", ic: "100510-10-1994", gender: "P", modules: [3, 4, 4, 5, 5, 5, 5, 5, 5], overall: 5},
                {id: 5, name: "DARIUS VOON VANE YITT", ic: "100818-01-1389", gender: "L", modules: [3, 3, 3, 3, 4, 5, 4, 4, 4], overall: 4},
                {id: 6, name: "FOONG HUI XIN", ic: "100112-10-2342", gender: "P", modules: [3, 3, 3, 4, 5, 5, 5, 4, 4], overall: 5},
                {id: 7, name: "KHAW XIN YU", ic: "100712-14-0414", gender: "P", modules: [3, 4, 3, 4, 4, 4, 4, 4, 4], overall: 3},
                {id: 8, name: "KHOO KAI FENG", ic: "101106-10-1145", gender: "L", modules: [3, 4, 4, 5, 5, 5, 5, 5, 5], overall: 5},
                {id: 9, name: "LAU HUI MING", ic: "100509-16-0057", gender: "L", modules: [3, 3, 3, 4, 5, 5, 4, 4, 4], overall: 5},
                {id: 10, name: "LOW YAN FUNG", ic: "100608-10-2741", gender: "L", modules: [3, 3, 3, 4, 4, 5, 3, 3, 3], overall: 4},
                {id: 11, name: "MARCUS TAN CHEE JIE", ic: "100206-14-0665", gender: "L", modules: [3, 4, 3, 4, 4, 5, 4, 4, 4], overall: 4},
                {id: 12, name: "NGEOW KAI YEE", ic: "100611-14-0802", gender: "P", modules: [3, 4, 3, 4, 4, 5, 5, 5, 5], overall: 5},
                {id: 13, name: "RYAN CHAN WEI HAO", ic: "100602-05-0127", gender: "L", modules: [3, 3, 3, 3, 3, 4, 4, 4, 4], overall: 4},
                {id: 14, name: "SOON YI HONG", ic: "100419-10-2283", gender: "L", modules: [3, 4, 4, 5, 5, 5, 5, 5, 5], overall: 5},
                {id: 15, name: "TAN JING HOONG", ic: "101101-10-0055", gender: "L", modules: [3, 3, 3, 3, 3, 4, 3, 3, 3], overall: 3},
                {id: 16, name: "TAN XIN LE", ic: "100928-14-0886", gender: "P", modules: [3, 4, 4, 5, 5, 5, 5, 5, 5], overall: 5},
                {id: 17, name: "THAN KING KAI", ic: "101217-10-0989", gender: "L", modules: [3, 3, 3, 4, 5, 5, 4, 4, 4], overall: 4},
                {id: 18, name: "WONG JUN YAP", ic: "100830-10-1897", gender: "L", modules: [3, 3, 3, 3, 3, 3, 3, 3, 3], overall: 3},
                {id: 19, name: "WONG YI HSIEN", ic: "100415-16-0291", gender: "L", modules: [3, 4, 4, 5, 5, 5, 5, 5, 5], overall: 5},
                {id: 20, name: "WOO WEN XUAN", ic: "100407-10-2809", gender: "L", modules: [3, 3, 3, 4, 4, 5, 4, 4, 4], overall: 4},
                {id: 21, name: "YAP JOVAN", ic: "101008-14-1207", gender: "L", modules: [3, 4, 4, 5, 5, 5, 5, 5, 5], overall: 5},
                {id: 22, name: "YAW YIK THONG", ic: "101008-10-2152", gender: "P", modules: [3, 4, 3, 4, 4, 5, 5, 5, 5], overall: 5},
                {id: 23, name: "YUEN SONG WEI", ic: "100807-14-3693", gender: "L", modules: [3, 4, 3, 4, 5, 5, 5, 5, 5], overall: 5},
                {id: 24, name: "KEITH CHOW MING ZE", ic: "100323-14-0891", gender: "L", modules: ["-", "-", "-", "-", "-", "-", "-", "-", 3], overall: 3}
            ]
        };

        const listEl = document.getElementById('studentList');
        const reportArea = document.getElementById('reportArea');

        function renderList() {
            listEl.innerHTML = '';
            db.students.forEach(student => {
                const div = document.createElement('div');
                div.className = 'student-item';
                div.innerHTML = `
                    <span class="student-name">${student.name}</span>
                    <span style="font-size: 0.75rem; color: #94a3b8;">${student.gender}</span>
                `;
                div.onclick = () => {
                    document.querySelectorAll('.student-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    renderReport(student);
                };
                listEl.appendChild(div);
            });
        }

        function renderReport(student) {
            const { metadata } = db;
            
            let modulesHtml = '';
            student.modules.forEach((score, index) => {
                modulesHtml += `
                    <tr>
                        <td>Modul ${index + 1}</td>
                        <td class="score-col">${score !== "" ? score : "-"}</td>
                    </tr>
                `;
            });

            reportArea.innerHTML = `
                <div class="report-header">
                    <h1>LAPORAN PENTAKSIRAN BILIK DARJAH (PBD)</h1>
                    <p>${metadata.school}</p>
                    <p>${metadata.address}</p>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Nama Murid</span>
                        <span class="info-value">${student.name}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">No. Kad Pengenalan / MyKid</span>
                        <span class="info-value">${student.ic}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Kelas</span>
                        <span class="info-value">${metadata.class}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Tarikh Penilaian</span>
                        <span class="info-value">${metadata.date}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Mata Pelajaran</span>
                        <span class="info-value">${metadata.subject}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Guru Mata Pelajaran</span>
                        <span class="info-value">${metadata.teacher}</span>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Standard Prestasi / Modul</th>
                            <th class="score-col" style="width: 150px;">Tahap Penguasaan</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${modulesHtml}
                    </tbody>
                </table>

                <div class="overall-section">
                    <div class="overall-label">Tahap Penguasaan Keseluruhan</div>
                    <div class="overall-score">${student.overall !== "" ? student.overall : "-"}</div>
                </div>
            `;
        }

        // Initialize App
        renderList();
        
        // Select first student by default
        if(db.students.length > 0) {
            const firstItem = document.querySelector('.student-item');
            firstItem.click();
        }
    </script>
</body>
</html>
